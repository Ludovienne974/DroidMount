name: DroidMount
options:
  bundleIdPrefix: fr.ludovic
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    SWIFT_VERSION: "5.0"
targets:
  DroidMount:
    type: application
    platform: macOS
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.ludovic.DroidMount
        PRODUCT_NAME: DroidMount
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_HARDENED_RUNTIME: "YES"
    info:
      path: App/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: DroidMount
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "MIT License"
        CFBundleIconFile: DroidMount
